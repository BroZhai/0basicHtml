<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>密码展示</title>
    <link rel="icon" href="data:," />
    <style>
        .box {
            width: 400px;
            border-bottom: 1px solid gray;
            position: relative;
            /* border: 1px solid red; */
        }
        
        .box input{
            outline: none;
            width: 370px;
            height: 30px;
            border: 0px;
            position: relative;
            margin-left: 15px;
        }
        
        .box img{
            height: 20px;
            right: 10px;
            top: 8px;
            position: absolute;
        }

        .box button{
            position: absolute;
            margin-top: 4px;
            margin-left: 20px;
            height: 30px;
        }
    </style>
</head>

<body>
    <div class="box">
        <input name="result" type="password" placeholder="请输入密码">
        <img src="../../resources/JS/show.png" alt="图片加载失败...">
        <button>Go!</button>
    </div>
    
</body>
<script src="js/show_pass.js" type="text/javascript" charset="UTF-8"></script>

</html>
