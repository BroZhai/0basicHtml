<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vite</title>
    <link rel="stylesheet" href="node_modules/survey-core/survey-core.min.css">
    <!-- <script type="text/javascript" src="https://unpkg.com/survey-core/survey.core.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/survey-js-ui/survey-js-ui.min.js"></script> -->
</head>
<body>
    <h2>This is index.html provided by Vite</h2>

    <!-- 前端文件上传区 -->
    <form action="/upload/single" method="post" enctype="multipart/form-data">
        <input type="file" name="myfile">
        <button type="submit">Upload</button>
    </form>
    <br>
    <form action="/download/single" method="get">
        <button type="submit" name="/upload_folder/files" value="cirno.gif">Download Baka</button>
        <button type="submit" name="/upload_folder/files" value="A.pdf">Download trance</button>
    </form>
    <a href="/scan" id="scan_link">scan files under "files"</a>
    <h3>File List in 'upload_folder'</h3>
    <ul id="file_list">
        <!-- <li><a href="#">ajimi</a></li> -->
    </ul>
    <hr>
    <form action="/create_folder" method="get">
        <input type="text" id="create_folder" name="folder_name" placeholder="Create your custom folder">
        <button type="submit">submit</button>
    </form>
    <a href="/scan_folder" id="scan_folder">scan folders under "upload_folder"</a>
    <h3>Folder List</h3>
    <ul id="folder_list">

    </ul>

    <hr>
    <button id="refresh"> update Survey JS</button>
    <div id="surveyContainer"></div>
    
    <script src="main.js" type="module"></script>
</body>
</html>
